<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aither Mail</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f6f7f9}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.top{height:64px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;padding:0 22px;gap:18px}.brand{font-size:21px;font-weight:700;color:#4f46e5}.brand span{color:#202124;font-weight:500}.search{flex:1;max-width:650px;background:#f1f3f5;border-radius:10px;padding:10px 14px;border:1px solid transparent}.search:focus{outline:2px solid #c7d2fe;background:#fff}.shell{height:calc(100vh - 64px);display:grid;grid-template-columns:290px 1fr}.side{background:#fff;border-right:1px solid #dfe3e8;padding:18px}.compose{width:100%;padding:12px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;font-size:15px;margin-bottom:20px}.nav button{width:100%;padding:11px 13px;border:0;background:transparent;text-align:left;border-radius:8px;font-size:14px}.nav button:hover,.nav .active{background:#eef2ff}.main{min-width:0;display:grid;grid-template-columns:minmax(300px,420px) 1fr;background:#fff}.list{border-right:1px solid #dfe3e8;overflow:auto}.listhead{padding:16px;border-bottom:1px solid #dfe3e8;font-weight:700}.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f2;background:#fff;padding:14px 16px;cursor:pointer}.row:hover,.row.active{background:#f7f8ff}.from{font-weight:700}.subject{margin:4px 0;font-weight:600}.preview{color:#6b7280;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date{float:right;color:#7b8190;font-size:12px}.viewer{padding:26px;overflow:auto}.empty{height:100%;display:grid;place-items:center;color:#7b8190}.meta{color:#68707c;font-size:13px}.body{margin-top:25px;line-height:1.6;white-space:pre-wrap}.raw{margin-top:28px}.raw pre{white-space:pre-wrap;background:#f6f7f9;padding:14px;border-radius:8px;overflow:auto}.actions{display:flex;gap:8px;margin-left:auto}.actions button{border:1px solid #d9dde3;background:#fff;border-radius:7px;padding:7px 10px}.count{float:right;color:#6b7280;font-weight:400}@media(max-width:800px){.shell{grid-template-columns:210px 1fr}.main{grid-template-columns:1fr}.viewer{display:none}.list{border:0}.side{padding:12px}.top{padding:0 12px}.search{max-width:none}}
</style></head><body><header class="top"><div class="brand">Aither<span> Mail</span></div><input id="search" class="search" placeholder="Search captured messages…"><div class="actions"><button onclick="refresh()">Refresh</button><button onclick="clearAll()">Delete all</button></div></header><div class="shell"><aside class="side"><button class="compose" onclick="refresh()">Aither Mail</button><nav class="nav"><button class="active">Inbox <span id="count" class="count">0</span></button><button>SMTP: <b>1025</b></button><button>Web: <b>8025</b></button></nav></aside><main class="main"><section class="list"><div class="listhead">Captured mail <span id="status" class="count"></span></div><div id="list"></div></section><article id="viewer" class="viewer"><div class="empty">Select a message to inspect it.</div></article></main></div><script>
let messages=[],selected=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function strip(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}async function refresh(){const r=await fetch('/api/v2/messages');const d=await r.json();messages=d.items||[];render()}function render(){const q=$('search').value.toLowerCase();const a=messages.filter(m=>(m.from+' '+(m.subject||'')+' '+strip(m.body)).toLowerCase().includes(q));$('count').textContent=messages.length;$('status').textContent=a.length+' message'+(a.length===1?'':'s');$('list').innerHTML=a.map(m=>`<button class="row ${selected===m.id?'active':''}" onclick="openMsg('${esc(m.id)}')"><span class="date">${new Date(m.created).toLocaleString()}</span><div class="from">${esc(m.from||'(unknown)')}</div><div class="subject">${esc(m.subject||'(no subject)')}</div><div class="preview">${esc(strip(m.body).slice(0,180))}</div></button>`).join('')||'<div style="padding:25px;color:#6b7280">No captured messages.</div>'}async function openMsg(id){selected=id;const r=await fetch('/api/v1/messages/'+encodeURIComponent(id));if(!r.ok)return;const m=await r.json();render();$('viewer').innerHTML=`<h1>${esc(m.subject||'(no subject)')}</h1><div class="meta"><b>From:</b> ${esc(m.from)}<br><b>To:</b> ${esc((m.to||[]).join(', '))}<br><b>Received:</b> ${esc(new Date(m.created).toLocaleString())}</div><div class="body">${esc(m.body)}</div><details class="raw"><summary>View raw message</summary><pre>${esc(m.raw)}</pre></details>`}async function clearAll(){if(!confirm('Delete all captured messages?'))return;await fetch('/api/v2/messages',{method:'DELETE'});selected=null;await refresh();$('viewer').innerHTML='<div class="empty">Select a message to inspect it.</div>'}$('search').addEventListener('input',render);refresh();setInterval(refresh,3000)
</script></body></html>
