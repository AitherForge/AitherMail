<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AitherMail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--rail:#17242f;--bg:#f5f7f8;--card:#fff;--accent:#0e7c6b;--star:#e9a23b;--line:#e3e8eb;--muted:#687780;--text:#18252d;--danger:#b42318;--shadow:0 12px 35px rgba(23,36,47,.12)}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:'IBM Plex Sans',sans-serif;color:var(--text);background:var(--bg)}button,input,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:245px minmax(300px,390px) 1fr;overflow:hidden}.rail{background:var(--rail);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-size:24px;font-weight:600;padding:5px 12px 12px;letter-spacing:-.5px}.brand span{color:#56c7b2}.compose{border:0;background:#fff;color:var(--rail);border-radius:12px;padding:12px 16px;font-weight:600;text-align:left}.folders{display:flex;flex-direction:column;gap:4px}.folder{border:0;background:transparent;color:#c9d4d9;border-radius:9px;padding:11px 12px;text-align:left;display:flex;gap:12px;align-items:center}.folder:hover,.folder.active{background:rgba(255,255,255,.09);color:#fff}.count{margin-left:auto;font-size:12px}.account{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:14px 10px 0;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#2e5960;display:grid;place-items:center;font-weight:600}.account small{display:block;color:#aebdc4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}.signout{margin-left:auto;background:none;border:0;color:#b9c7cc}.list{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.topbar{padding:18px 16px 12px;border-bottom:1px solid var(--line)}.search{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 11px}.search input{width:100%;border:0;outline:0;background:transparent;padding:10px}.listhead{padding:14px 16px 8px;font-weight:600;display:flex;justify-content:space-between}.messages{overflow:auto}.row{border:0;border-bottom:1px solid var(--line);background:#fff;width:100%;padding:14px 16px;text-align:left;display:grid;grid-template-columns:26px 1fr auto;gap:8px}.row:hover,.row.selected{background:#f2f7f6}.row.unread .sender,.row.unread .subject{font-weight:600}.sender,.subject{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.snippet{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.date{font-size:12px;color:var(--muted);white-space:nowrap}.star{border:0;background:none;padding:0;color:#9aa7ad;font-size:18px}.star.on{color:var(--star)}.loading{padding:16px}.skeleton{height:64px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff,#eef2f3,#fff);background-size:200% 100%;animation:sh 1.1s infinite}@keyframes sh{to{background-position:-200% 0}}.empty{padding:60px 25px;text-align:center;color:var(--muted)}.reader{min-width:0;display:flex;flex-direction:column;background:var(--card)}.readerbar{min-height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 18px}.readerbar button,.iconbtn{border:0;background:transparent;border-radius:8px;padding:9px;color:var(--muted)}.readerbar button:hover,.iconbtn:hover{background:var(--bg);color:var(--text)}.readerbody{overflow:auto;padding:30px clamp(20px,5vw,60px)}.readerbody h1{font-size:25px;margin:0 0 18px}.meta{display:flex;gap:12px;align-items:center;margin-bottom:25px}.meta .avatar{flex:none}.meta strong{display:block}.meta span{color:var(--muted);font-size:13px}.email-frame{width:100%;min-height:360px;border:0;background:#fff}.setup,.signedout{height:100dvh;display:grid;place-items:center;padding:20px;background:var(--bg)}.setup-card,.login-card{max-width:620px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:34px}.setup-card h1,.login-card h1{margin-top:0}.setup-card code{display:block;background:#f0f3f4;padding:12px;border-radius:8px;overflow:auto}.setup-card ol{padding-left:22px;line-height:1.7}.login-card{text-align:center;max-width:440px}.logo{font-size:42px;font-weight:600;color:var(--rail);margin-bottom:10px}.logo span{color:var(--accent)}.error{color:var(--danger);background:#fff0ef;padding:11px;border-radius:8px;margin-top:12px}.toast{position:fixed;right:20px;bottom:20px;background:var(--rail);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;max-width:min(420px,calc(100vw - 40px))}.modal{position:fixed;inset:0;background:rgba(10,20,26,.45);display:grid;place-items:center;padding:18px;z-index:10}.composebox{width:min(680px,100%);background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.modalhead{padding:15px 18px;background:var(--rail);color:#fff;display:flex;justify-content:space-between}.modalhead button{background:none;border:0;color:#fff}.fields input,.fields textarea{display:block;width:100%;border:0;border-bottom:1px solid var(--line);outline:0;padding:12px 16px}.fields textarea{min-height:260px;resize:vertical}.modalfoot{padding:12px 16px;display:flex;justify-content:space-between}.send{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:10px 18px;font-weight:600}.secondary{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px}.back{display:none}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:68px minmax(0,1fr)}.rail{padding:18px 8px}.brand{font-size:0;text-align:center}.brand:first-letter{font-size:24px}.compose{font-size:0;text-align:center;padding:12px}.compose:before{content:'+';font-size:25px}.folder{justify-content:center;font-size:0}.folder .ico{font-size:20px}.count,.account div:not(.avatar),.signout{display:none}.account{justify-content:center;padding-left:0;padding-right:0}.reader{position:fixed;inset:0;z-index:5}.reader.open{display:flex}.back{display:block}.list{grid-column:2}.readerbar{padding-left:10px}.readerbody{padding:24px 18px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CLIENT_ID='YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.send';
const API='https://gmail.googleapis.com/gmail/v1/users/me';
let token=null,tokenClient=null,profile=null,currentLabel='INBOX',nextPageToken=null,selected=null,searchQuery='',refreshing=false;
const labels=[['INBOX','Inbox','⌂'],['STARRED','Starred','★'],['SENT','Sent','➤'],['DRAFT','Drafts','▱'],['TRASH','Trash','♜']];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setup(){document.body.innerHTML=`<main class="setup"><section class="setup-card"><h1>Set up AitherMail</h1><p>Add your Google OAuth Web client ID to the <code>CLIENT_ID</code> constant in <code>index.html</code>.</p><ol><li>Open Google Cloud Console and create/select a project.</li><li>Enable the Gmail API.</li><li>Configure OAuth consent as External → Testing and add your Gmail address as a test user.</li><li>Create OAuth credentials → Web application.</li><li>Add <code>https://${location.hostname}</code> and <code>http://localhost:8000</code> as JavaScript origins.</li><li>Paste the client ID into <code>CLIENT_ID</code> and redeploy.</li></ol><p><b>Scopes:</b> Gmail modify + Gmail send only. No backend and no tokens stored in browser storage.</p></section></main>`}
function signedOut(){document.body.innerHTML=`<main class="signedout"><section class="login-card"><div class="logo">Aither<span>Mail</span></div><p>Real Gmail, with a quieter interface.</p><button class="send" onclick="login()">Sign in with Google</button><p id="loginError" class="error hidden"></p></section></main>`}
function login(){if(!window.google?.accounts?.oauth2){setTimeout(login,500);return} if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async r=>{if(r.error){showLoginError(r.error_description||r.error);return}token=r.access_token;try{profile=await api('/profile');renderApp();await loadMessages(true)}catch(e){token=null;showLoginError(e.message)}}});tokenClient.requestAccessToken({prompt:''})}
function showLoginError(x){const el=$('#loginError');if(el){el.textContent=x;el.classList.remove('hidden')}}
async function api(path,opts={},retry=true){if(!token)throw Error('Not signed in');const res=await fetch(API+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(res.status===401&&retry){await new Promise((resolve,reject)=>tokenClient.requestAccessToken({prompt:'',callback:r=>r.error?reject(Error(r.error_description||r.error)):resolve()}));return api(path,opts,false)}if(!res.ok){let msg='Gmail API error '+res.status;try{const j=await res.json();msg=j.error?.message||msg}catch{}throw Error(msg)}return res.status===204?null:res.json()}
function renderApp(){document.body.innerHTML=`<div class="app"><aside class="rail"><div class="brand">Aither<span>Mail</span></div><button class="compose" onclick="openCompose()">Compose</button><nav class="folders">${labels.map(([id,name,ico])=>`<button class="folder ${id===currentLabel?'active':''}" onclick="switchFolder('${id}')"><span class="ico">${ico}</span><span>${name}</span><span class="count" id="count-${id}"></span></button>`).join('')}</nav><div class="account"><div class="avatar">${esc((profile.emailAddress||'?')[0].toUpperCase())}</div><div><b>${esc(profile.emailAddress)}</b><small>Gmail account</small></div><button class="signout" onclick="logout()" title="Sign out">↪</button></div></aside><section class="list"><div class="topbar"><form class="search" onsubmit="doSearch(event)"><span>⌕</span><input id="search" placeholder="Search Gmail" value="${esc(searchQuery)}" autocomplete="off"></form></div><div class="listhead"><span id="folderTitle">Inbox</span><button class="iconbtn" onclick="loadMessages(true)">↻</button></div><div id="messages" class="messages"></div></section><section id="reader" class="reader"><div class="readerbar"><button class="back" onclick="closeReader()">←</button><button onclick="archiveSelected()">Archive</button><button onclick="trashSelected()">Trash</button><button onclick="toggleStarSelected()">★</button><button onclick="markUnreadSelected()">Mark unread</button><button class="iconbtn" style="margin-left:auto" onclick="closeReader()">×</button></div><div id="readerbody" class="readerbody"><div class="empty">Select a message to read it.</div></div></section></div>`}
async function switchFolder(id){currentLabel=id;selected=null;searchQuery='';document.querySelectorAll('.folder').forEach((b,i)=>b.classList.toggle('active',labels[i][0]===id));$('#folderTitle').textContent=labels.find(x=>x[0]===id)[1];$('#search').value='';closeReader();await loadMessages(true)}
function skeleton(){return '<div class="loading">'+Array.from({length:7},()=>'<div class="skeleton"></div>').join('')+'</div>'}
async function loadMessages(reset=false){if(refreshing)return;refreshing=true;nextPageToken=reset?null:nextPageToken;const box=$('#messages');if(reset)box.innerHTML=skeleton();try{const q=new URLSearchParams({maxResults:'25'});if(currentLabel)q.set('labelIds',currentLabel);if(searchQuery)q.set('q',searchQuery);if(!reset&&nextPageToken)q.set('pageToken',nextPageToken);const page=await api('/messages?'+q);nextPageToken=page.nextPageToken||null;const msgs=await Promise.all((page.messages||[]).map(m=>api('/messages/'+m.id+'?format=metadata&metadataHeaders=From&metadataHeaders=To&metadataHeaders=Subject&metadataHeaders=Date')));const html=msgs.map(messageRow).join('');if(reset)box.innerHTML=html||'<div class="empty">No messages here.</div>';else box.insertAdjacentHTML('beforeend',html);if(nextPageToken)box.insertAdjacentHTML('beforeend','<button class="secondary" style="margin:16px" onclick="loadMessages(false)">Load more</button>')}catch(e){box.innerHTML='<div class="empty">Could not load mail.<br><br>'+esc(e.message)+'</div>';toast(e.message)}finally{refreshing=false}}
function header(m,n){return (m.payload?.headers||[]).find(h=>h.name.toLowerCase()===n.toLowerCase())?.value||''}
function messageRow(m){const unread=(m.labelIds||[]).includes('UNREAD'),star=(m.labelIds||[]).includes('STARRED');const from=parseFrom(header(m,'From'));return `<button class="row ${unread?'unread':''} ${selected===m.id?'selected':''}" onclick="openMessage('${m.id}')"><button class="star ${star?'on':''}" onclick="event.stopPropagation();toggleStar('${m.id}',${star})">★</button><div><div class="sender">${esc(from.name||from.email)}</div><div class="subject">${esc(header(m,'Subject')||'(no subject)')}</div><div class="snippet">${esc(m.snippet||'')}</div></div><span class="date">${formatDate(header(m,'Date'))}</span></button>`}
function parseFrom(v){const x=v.match(/^(.*?)[ ]*<([^>]+)>$/);return x?{name:x[1].replace(/^"|"$/g,''),email:x[2]}:{name:v,email:v}}
function formatDate(v){if(!v)return '';const d=new Date(v);return isNaN(d)?v.slice(0,16):d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function b64decode(s){s=(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function findBody(part,want){if(!part)return null;if(part.mimeType===want&&part.body?.data)return b64decode(part.body.data);for(const p of part.parts||[]){const x=findBody(p,want);if(x!==null)return x}return null}
function plainToHtml(s){return esc(s).replace(/\n/g,'<br>')}
async function openMessage(id){selected=id;document.querySelectorAll('.row').forEach(r=>r.classList.remove('selected'));try{const m=await api('/messages/'+id+'?format=full');const from=parseFrom(header(m,'From'));const to=header(m,'To');const subject=header(m,'Subject')||'(no subject)';const html=findBody(m.payload,'text/html');const plain=findBody(m.payload,'text/plain');const body=html||plainToHtml(plain||m.snippet||'');$('#readerbody').innerHTML=`<h1>${esc(subject)}</h1><div class="meta"><div class="avatar">${esc((from.name||from.email||'?')[0].toUpperCase())}</div><div><strong>${esc(from.name||from.email)}</strong><span>${esc(from.email)} · to ${esc(to)}</span></div></div><iframe class="email-frame" sandbox="" srcdoc="${esc(body)}"></iframe><div style="margin-top:24px"><button class="send" onclick="openCompose(true)">Reply</button></div>`;$('#reader').classList.add('open');if((m.labelIds||[]).includes('UNREAD')){await api('/messages/'+id+'/modify',{method:'POST',body:JSON.stringify({removeLabelIds:['UNREAD']})});loadMessages(true)}}catch(e){toast(e.message)}}
async function action(id,endpoint,body){try{await api('/messages/'+id+endpoint,{method:'POST',body:body?JSON.stringify(body):undefined});await loadMessages(true);if(selected===id)closeReader()}catch(e){toast(e.message)}}
function archiveSelected(){if(selected)action(selected,'/modify',{removeLabelIds:['INBOX']})}function trashSelected(){if(selected)action(selected,'/trash')}function markUnreadSelected(){if(selected)action(selected,'/modify',{addLabelIds:['UNREAD']})}function toggleStarSelected(){if(!selected)return;const r=document.querySelector('.row.selected .star');action(selected,'/modify',{addLabelIds:r?.classList.contains('on')?[]:['STARRED'],removeLabelIds:r?.classList.contains('on')?['STARRED']:[]})}function toggleStar(id,on){action(id,'/modify',{addLabelIds:on?[]:['STARRED'],removeLabelIds:on?['STARRED']:[]})}
function closeReader(){$('#reader')?.classList.remove('open');selected=null}
function doSearch(e){e.preventDefault();searchQuery=$('#search').value.trim();loadMessages(true)}
function openCompose(reply=false){let to='',subject='',body='',replyHeaders='';if(reply&&selected){api('/messages/'+selected+'?format=full').then(m=>{const from=parseFrom(header(m,'Reply-To')||header(m,'From'));to=from.email;subject=/^re:/i.test(header(m,'Subject'))?header(m,'Subject'):'Re: '+(header(m,'Subject')||'');const mid=header(m,'Message-ID');const refs=header(m,'References');replyHeaders=`<input id="replyMessageId" type="hidden" value="${esc(mid)}"><input id="replyReferences" type="hidden" value="${esc(refs)}">`;showCompose(to,subject,body,replyHeaders)})}else showCompose(to,subject,body,'')}
function showCompose(to,subject,body,extra){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="compose"><form class="composebox" onsubmit="sendMail(event)"><div class="modalhead"><span>New message</span><button type="button" onclick="$('#compose').remove()">×</button></div><div class="fields"><input id="to" required placeholder="To" value="${esc(to)}"><input id="subject" placeholder="Subject" value="${esc(subject)}">${extra}<textarea id="body" placeholder="Write a message…">${esc(body)}</textarea></div><div class="modalfoot"><button type="button" class="secondary" onclick="$('#compose').remove()">Discard</button><button id="sendBtn" class="send">Send</button></div></form></div>`)}
function b64encode(s){const bytes=new TextEncoder().encode(s);let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function rfc2047(s){if(/^[\x00-\x7F]*$/.test(s))return s;return '=?UTF-8?B?'+b64encode(s)+'?='}
function rawMail(to,subject,body,mid,refs){const lines=['From: '+profile.emailAddress,'To: '+to,'Subject: '+rfc2047(subject||''),'MIME-Version: 1.0','Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: 8bit'];if(mid)lines.push('In-Reply-To: '+mid);if(refs)lines.push('References: '+(refs+' '+mid).trim());return b64encode(lines.join('\r\n')+'\r\n\r\n'+body)}
async function sendMail(e){e.preventDefault();const btn=$('#sendBtn');btn.disabled=true;btn.textContent='Sending…';try{const mid=$('#replyMessageId')?.value||'';const refs=$('#replyReferences')?.value||'';const raw=rawMail($('#to').value.trim(),$('#subject').value,$('#body').value,mid,refs);await api('/messages/send',{method:'POST',body:JSON.stringify({raw,threadId:selected||undefined})});$('#compose').remove();toast('Message sent')}catch(err){toast(err.message);btn.disabled=false;btn.textContent='Send'}}
function toast(msg){const old=$('.toast');old?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
function logout(){token=null;profile=null;tokenClient=null;signedOut()}
if(CLIENT_ID.startsWith('YOUR_'))setup();else signedOut();
</script>
</body>
</html>
